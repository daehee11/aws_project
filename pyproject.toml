[project]
name = "awsproject"
version = "0.1.0"
description = "서버리스 AI 공지 요약 알림 봇"
requires-python = ">=3.12,<3.13"

[tool.pytest.ini_options]
# Lambda와 같은 import 경로(crawler.handler, common.schema ...)를 쓰기 위해 src를 루트로 둔다.
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".aws-sam", "layers"]

[tool.ruff.lint]
# 기본 규칙(E4, E7, E9, F) + import 정렬
extend-select = ["I"]
